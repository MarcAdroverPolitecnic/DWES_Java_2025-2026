<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<table>
    <tr>
        <th>Title</th>
        <th>Year</th>
    </tr>
    <tr th:each="movie : ${movies}">
        <td th:text="${movie.title}">Onions</td>
        <td th:text="${movie.year}">2.41</td>
    </tr>
</table>
</body>
</html>
