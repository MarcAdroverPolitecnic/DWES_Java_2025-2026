# ===================================================================
# Propietats Generals de l'Aplicació
# ===================================================================

# Nom de l'aplicació
spring.application.name=prova

# ===================================================================
# Propietats del Servidor Encastat (Embedded Server)
# ===================================================================

# Port en el que correrà el servidor d'aplicacions (per defecte 8080)
server.port=8080

# Context path de l'aplicació (per defecte /)
# server.servlet.context-path=/la-meva-app

# ===================================================================
# Propietats de la Base de Dades (DataSource) - Exemple amb MySQL
# ===================================================================

# URL de connexió a la base de dades. Canvia 'localhost', '3306' i 'nom_bd' segons la teva configuració
spring.datasource.url=jdbc:mysql://localhost:3306/movies?createDatabaseIfNotExist=true

# Nom d'usuari per a la connexió a la base de dades
spring.datasource.username=root

# Contrasenya per a la connexió a la base de dades
spring.datasource.password=root

# Driver de la base de dades
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# Propietats de JPA (Java Persistence API) / Hibernate
# ===================================================================

# Indica a Hibernate que generi automàticament l'esquema de la base de dades
# Valors possibles: none, validate, update, create, create-drop
spring.jpa.hibernate.ddl-auto=update

# Mostra les consultes SQL generades per Hibernate a la consola
spring.jpa.show-sql=true

# Dialecte de la base de dades que utilitzarà Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================================================================
# Propietats de Spring MVC i Thymeleaf (motor de plantilles)
# ===================================================================

# Prefix que s'afegeix als noms de les vistes per trobar les plantilles
spring.thymeleaf.prefix=classpath:/templates/

# Sufix que s'afegeix als noms de les vistes per trobar les plantilles
spring.thymeleaf.suffix=.html

# Habilita o deshabilita la cache de plantilles (útil per a desenvolupament)
spring.thymeleaf.cache=false

# ===================================================================
# Propietats de Logging
# ===================================================================

# Nivell de log per a tot el projecte (p. ex., INFO, DEBUG, ERROR)
logging.level.root=INFO

# Nivell de log específic per a paquets de Spring
logging.level.org.springframework.web=DEBUG

# Nivell de log per a Hibernate
logging.level.org.hibernate=ERROR
