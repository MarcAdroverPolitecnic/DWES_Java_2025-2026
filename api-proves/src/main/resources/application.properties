# ===================================================================
# Propietats Generals de l'Aplicaci
# ===================================================================

# Nom de l'aplicaci
spring.application.name=api-proves

# ===================================================================
# Propietats del Servidor Encastat (Embedded Server)
# ===================================================================

# Port en el que correr el servidor d'aplicacions (per defecte 8080)
server.port=8080

# Context path de l'aplicaci (per defecte /)
# server.servlet.context-path=/la-meva-app

# ===================================================================
# Propietats de la Base de Dades (DataSource) - Exemple amb MySQL
# ===================================================================

# URL de connexi a la base de dades. Canvia 'localhost', '3306' i 'nom_bd' segons la teva configuraci
spring.datasource.url=jdbc:mysql://localhost:3306/movies?createDatabaseIfNotExist=true

# Nom d'usuari per a la connexi a la base de dades
spring.datasource.username=root

# Contrasenya per a la connexi a la base de dades
spring.datasource.password=root

# Driver de la base de dades
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# Propietats de JPA (Java Persistence API) / Hibernate
# ===================================================================

# Indica a Hibernate que generi automticament l'esquema de la base de dades
# Valors possibles: none, validate, update, create, create-drop
spring.jpa.hibernate.ddl-auto=create-drop

# Mostra les consultes SQL generades per Hibernate a la consola
spring.jpa.show-sql=true

# Dialecte de la base de dades que utilitzar Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================================================================
# Propietats de Spring MVC i Thymeleaf (motor de plantilles)
# ===================================================================

# Prefix que s'afegeix als noms de les vistes per trobar les plantilles
spring.thymeleaf.prefix=classpath:/templates/

# Sufix que s'afegeix als noms de les vistes per trobar les plantilles
spring.thymeleaf.suffix=.html

# Habilita o deshabilita la cache de plantilles (til per a desenvolupament)
spring.thymeleaf.cache=false

# ===================================================================
# Propietats de Logging
# ===================================================================

# Nivell de log per a tot el projecte (p. ex., INFO, DEBUG, ERROR)
logging.level.root=INFO

# Nivell de log especfic per a paquets de Spring
logging.level.org.springframework.web=DEBUG

# Nivell de log per a Hibernate
logging.level.org.hibernate=ERROR

# ===================================================================
# JWT
# ===================================================================
#jwt.secret=change-this-secret-to-a-long-random-string-at-least-32-bytes
#jwt.expiration-seconds=3600

application.security.jwt.secret=1234abcd1234abcd1234abcd1234abcd1234abcd1234abcd1234abcd1234abcd
application.security.jwt.expiration=3600
application.security.jwt.issuer=api-proves